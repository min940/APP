<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff8fab" />
  <title>우리집 게임방 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">

    <!-- 🏠 홈 화면 -->
    <section class="screen active" id="screen-home">
      <div class="hero">
        <div class="logo-emoji">🎲🎯🎨</div>
        <h1 class="title">우리집 게임방</h1>
        <p class="subtitle">온 가족이 각자 핸드폰으로<br />함께 즐기는 게임 놀이터</p>
      </div>
      <div class="home-form card">
        <label class="field-label">내 이름 (별명)</label>
        <input id="input-nickname" class="big-input" type="text" maxlength="12" placeholder="예: 아빠, 엄마, 민서" autocomplete="off" />
        <button id="btn-create" class="btn btn-primary btn-block">🚪 새 게임방 만들기</button>
        <div class="divider"><span>또는</span></div>
        <div class="join-row">
          <input id="input-code" class="big-input code-input" type="tel" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" />
          <button id="btn-join" class="btn btn-secondary">참가</button>
        </div>
      </div>
      <p class="tip">💡 한 명이 방을 만들고 <b>방 번호</b>를 가족에게 알려주세요. 각자 폰에서 번호를 입력하면 같은 방에서 만나요!</p>
    </section>

    <!-- 🛋️ 대기실(로비) -->
    <section class="screen" id="screen-lobby">
      <div class="room-header">
        <div class="room-code-box">
          <span class="room-code-label">방 번호</span>
          <span id="lobby-code" class="room-code">----</span>
        </div>
        <button id="btn-share" class="btn btn-ghost btn-sm">📋 번호 복사</button>
      </div>

      <div class="card">
        <h2 class="section-title">참가한 사람 <span id="player-count" class="count-badge">0</span></h2>
        <ul id="player-list" class="player-list"></ul>
      </div>

      <div class="card">
        <h2 class="section-title">게임 고르기</h2>
        <div class="game-grid" id="game-grid">
          <button class="game-card" data-game="quiz">
            <span class="game-emoji">🎯</span>
            <span class="game-name">퀴즈 배틀</span>
            <span class="game-desc">가장 빨리 정답 맞히기</span>
          </button>
          <button class="game-card" data-game="draw">
            <span class="game-emoji">🎨</span>
            <span class="game-name">그림 맞히기</span>
            <span class="game-desc">그리고 채팅으로 맞히기</span>
          </button>
          <button class="game-card" data-game="bingo">
            <span class="game-emoji">🔢</span>
            <span class="game-name">빙고</span>
            <span class="game-desc">먼저 3줄 완성하기</span>
          </button>
        </div>
      </div>

      <div id="host-controls" class="host-controls hidden">
        <button id="btn-start" class="btn btn-primary btn-block btn-lg" disabled>게임 시작 ▶</button>
      </div>
      <p id="guest-wait" class="tip">방장이 게임을 고르는 중이에요. 잠시만 기다려 주세요 😊</p>
    </section>

    <!-- 🎮 게임 화면 (공통 컨테이너) -->
    <section class="screen" id="screen-game">
      <div class="game-topbar">
        <button id="btn-leave-game" class="btn btn-ghost btn-sm">← 나가기</button>
        <span id="game-title" class="game-topbar-title"></span>
        <span id="game-round" class="game-round"></span>
      </div>

      <!-- 미니 점수판 -->
      <div id="mini-scores" class="mini-scores"></div>

      <!-- 각 게임 UI가 여기에 렌더링됨 -->
      <div id="game-body" class="game-body"></div>

      <!-- 채팅 (그림게임/공통) -->
      <div id="chat-panel" class="chat-panel hidden">
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" class="chat-input" type="text" maxlength="100" placeholder="정답을 입력해 보세요!" autocomplete="off" />
          <button class="btn btn-secondary btn-sm" type="submit">전송</button>
        </form>
      </div>
    </section>

    <!-- 🏆 결과 화면 -->
    <section class="screen" id="screen-result">
      <div class="result-hero">
        <div class="trophy">🏆</div>
        <h1 id="result-winner" class="result-winner"></h1>
      </div>
      <div class="card">
        <h2 class="section-title">최종 점수</h2>
        <ol id="result-scores" class="result-scores"></ol>
      </div>
      <div id="result-host-controls" class="host-controls">
        <button id="btn-again" class="btn btn-primary btn-block btn-lg">🔁 다시 하기 / 다른 게임</button>
      </div>
      <p id="result-guest-wait" class="tip">방장이 다음 게임을 고르는 중이에요 😊</p>
    </section>

  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/quiz.js"></script>
  <script src="/js/bingo.js"></script>
  <script src="/js/draw.js"></script>
</body>
</html>
